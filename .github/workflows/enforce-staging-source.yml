name: enforce-staging-source
on:
  pull_request_target:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Verify PR source branch is staging
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "::error::PRs to main must come from the staging branch only."
            echo "Current head branch: $HEAD_REF"
            exit 1
          fi
          echo "OK: PR source branch is staging."
